# Runs on the public GitHub mirror only (Forgejo reads .forgejo/workflows).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No go.sum is tracked in this module, so there is nothing to cache.
          # Re-enable cache again once a go.sum is added (that is what silences
          # the "cache disabled" warning permanently).
          cache: false
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
