# The first CI of a new repo, from the charter (ADR 0045): replace or extend it by pull request.
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: desk
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          token="${{ forgejo.token }}"
          # server_url already carries the scheme (e.g. https://office-local…ts.net),
          # so strip it before building the host to avoid a doubled scheme
          # (https://https://…) that makes git clone fail at checkout.
          server_url="${{ forgejo.server_url }}"
          host="${server_url#https://}"
          host="${host#http://}"
          # server_url also carries the project path (e.g. /braintrust), so strip
          # to the first path segment: a host ending in /project makes the clone
          # URL .../project/project/repo.git -> "not found" at checkout.
          host="${host%%/*}"
          repo="${{ forgejo.repository }}"
          if [ -n "$token" ]; then
            url="https://x-access-token:${token}@${host}/${repo}.git"
          else
            url="https://${host}/${repo}"
          fi
          git clone "$url" .
          # The clone is on main: test the commit this run is for, the pushed commit or the pull request's head.
          git checkout --detach "${{ forgejo.sha }}"
      - name: shellcheck *.sh (bash -n fallback)
        run: |
          set -euo pipefail
          files="$(git ls-files '*.sh')"
          if [ -z "$files" ]; then
            echo "no shell scripts tracked; nothing to check"
            exit 0
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            rc=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "shellcheck: $f"
              if ! shellcheck "$f"; then rc=1; fi
            done <<< "$files"
            if [ "$rc" -ne 0 ]; then
              echo "shellcheck reported findings above." >&2
              exit 1
            fi
            echo "shellcheck clean."
            exit 0
          fi
          echo "shellcheck not found on desk runner; falling back to bash -n" >&2
          rc=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! bash -n "$f"; then echo "syntax error: $f" >&2; rc=1; fi
          done <<< "$files"
          exit $rc
      - name: Build and test Go (no network)
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # No network: tests run against httptest fakes only.
          export GOPROXY=off
          go build ./...
          go vet ./...
          go test ./...
      - name: Race detector (go test -race)
        # The race detector needs CGO, which needs a C compiler. The desk
        # runner ships without one, so this step guards on the compiler and
        # prints a notice and skips rather than failing: a missing compiler is
        # an environment gap for the founder to close, not a code defect.
        run: |
          set -euo pipefail
          if command -v cc >/dev/null 2>&1 && command -v gcc >/dev/null 2>&1; then
            echo "C compiler found; running go test -race ./..."
            export GOPROXY=off
            go test -race ./...
          else
            echo "no C compiler on desk runner; skipping go test -race" >&2
            echo "install a C compiler (gcc/clang) so the race detector runs" >&2
            exit 0
          fi
      - name: staticcheck
        # Runs only if already installed on the desk runner; a missing tool is
        # reported, not failed, so the founder knows to install it. CGO is off:
        # without a C compiler staticcheck fails to build runtime/cgo, so the
        # same guard the race step uses keeps staticcheck from failing on it.
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          if command -v staticcheck >/dev/null 2>&1; then
            echo "staticcheck found; running against all packages"
            export GOPROXY=off
            staticcheck ./...
          else
            echo "staticcheck not found on desk runner; skipping" >&2
            exit 0
          fi
      - name: golangci-lint
        # Runs only if already installed on the desk runner; a missing tool is
        # reported, not failed, so the founder knows to install it.
        run: |
          set -euo pipefail
          if command -v golangci-lint >/dev/null 2>&1; then
            echo "golangci-lint found; running linters"
            export GOPROXY=off
            golangci-lint run ./...
          else
            echo "golangci-lint not found on desk runner; skipping" >&2
            exit 0
          fi
      - name: Lint tool availability
        # Reports which linters are missing so the founder can install them.
        # This is informational only: the steps above already skip cleanly.
        run: |
          set -uo pipefail
          echo "=== lint tool availability on desk runner ==="
          for tool in staticcheck golangci-lint; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: installed ($( "$tool" --version 2>&1 | head -1 ))"
            else
              echo "$tool: MISSING — install it so CI can lint"
            fi
          done
          echo "=== C compiler (needed for go test -race) ==="
          if command -v cc >/dev/null 2>&1 && command -v gcc >/dev/null 2>&1; then
            echo "C compiler: installed"
          else
            echo "C compiler: MISSING — install gcc/clang so go test -race runs"
          fi
      - name: Cross-compile smoke check
        env:
          CGO_ENABLED: "0"
          GOPROXY: "off"
        run: |
          set -euo pipefail
          # No network, output discarded: this only checks the standard-library
          # cross-compiler still builds for each supported platform. Public
          # releases ship via GoReleaser on the GitHub mirror, not here.
          GOOS=darwin   GOARCH=arm64   go build -o /dev/null .
          GOOS=linux    GOARCH=amd64   go build -o /dev/null .
          GOOS=linux    GOARCH=arm64   go build -o /dev/null .
          GOOS=windows  GOARCH=amd64   go build -o /dev/null .
