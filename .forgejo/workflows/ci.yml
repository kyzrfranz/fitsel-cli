# The first CI of a new repo, from the charter (ADR 0045): replace or extend it by pull request.
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: desk
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          token="${{ forgejo.token }}"
          # server_url already carries the scheme (e.g. https://office-local…ts.net),
          # so strip it before building the host to avoid a doubled scheme
          # (https://https://…) that makes git clone fail at checkout.
          server_url="${{ forgejo.server_url }}"
          host="${server_url#https://}"
          host="${host#http://}"
          repo="${{ forgejo.repository }}"
          if [ -n "$token" ]; then
            url="https://x-access-token:${token}@${host}/${repo}.git"
          else
            url="https://${host}/${repo}"
          fi
          git clone "$url" .
          # The clone is on main: test the commit this run is for, the pushed commit or the pull request's head.
          git checkout --detach "${{ forgejo.sha }}"
      - name: shellcheck *.sh (bash -n fallback)
        run: |
          set -euo pipefail
          files="$(git ls-files '*.sh')"
          if [ -z "$files" ]; then
            echo "no shell scripts tracked; nothing to check"
            exit 0
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            rc=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "shellcheck: $f"
              if ! shellcheck "$f"; then rc=1; fi
            done <<< "$files"
            if [ "$rc" -ne 0 ]; then
              echo "shellcheck reported findings above." >&2
              exit 1
            fi
            echo "shellcheck clean."
            exit 0
          fi
          echo "shellcheck not found on desk runner; falling back to bash -n" >&2
          rc=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! bash -n "$f"; then echo "syntax error: $f" >&2; rc=1; fi
          done <<< "$files"
          exit $rc
      - name: Build and test Go (no network)
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # No network: tests run against httptest fakes only.
          export GOPROXY=off
          go build ./...
          go vet ./...
          go test ./...
  build:
    # Cross-compile the release binaries for every supported platform,
    # on every merge to main (ADR 0067). Publishes them as CI artifacts,
    # untagged, so the founder can tag and publish v1.
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: desk
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            out: garmin-sync
          - os: linux
            arch: amd64
            out: garmin-sync-linux-amd64
          - os: linux
            arch: arm64
            out: garmin-sync-linux-arm64
          - os: windows
            arch: amd64
            out: garmin-sync-windows-amd64.exe
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          token="${{ forgejo.token }}"
          # server_url already carries the scheme (e.g. https://office-local…ts.net),
          # so strip it before building the host to avoid a doubled scheme
          # (https://https://…) that makes git clone fail at checkout.
          server_url="${{ forgejo.server_url }}"
          host="${server_url#https://}"
          host="${host#http://}"
          repo="${{ forgejo.repository }}"
          if [ -n "$token" ]; then
            url="https://x-access-token:${token}@${host}/braintrust/${repo}.git"
          else
            url="https://${host}/${repo}"
          fi
          git clone "$url" .
          # The clone is on main: build the commit this run is for (push to main).
          git checkout --detach "${{ forgejo.sha }}"
      - name: Cross-compile for ${{ matrix.os }} ${{ matrix.arch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # No network: the standard library cross-compiler needs no downloads.
          export GOPROXY=off
          go build -o ${{ matrix.out }} .
          ls -la ${{ matrix.out }}
      - name: Stage the binary for release
        run: |
          set -euo pipefail
          # The desk runner's CI is custom and cannot be relied on to support
          # actions/upload-artifact, so the built binary is pushed to the
          # release-binaries branch for the founder to download (see README).
          mkdir -p release-binaries
          cp "${{ matrix.out }}" "release-binaries/${{ matrix.out }}"
          ls -la release-binaries
          git add release-binaries
          git -c user.name=developer -c user.email=developer@braintrust.internal \
            commit -m "Release binary for ${{ matrix.os }} ${{ matrix.arch }}" || true
          git push origin "release-binaries:release-binaries"
