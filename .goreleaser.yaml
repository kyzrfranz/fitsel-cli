# Release config for the public GitHub mirror (kyzrfranz/fitsel-cli): builds the
# binaries, publishes a GitHub Release and updates the Homebrew tap. Run by
# .github/workflows/release.yml on a v* tag.
version: 2
project_name: fitsel-client

builds:
  - binary: fitsel-client
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Debian (.deb) and RPM (.rpm) packages so the binary reaches Debian/Ubuntu and
# Fedora/RHEL users. GoReleaser attaches these to the GitHub Release alongside
# the archives and checksums automatically (no workflow change). The default
# file name is fitsel-client_<version>_linux_<arch>.{deb,rpm}, which matches the
# fitsel-client_* install glob. Both formats share this one block.
nfpms:
  - package_name: fitsel-client
    ids: [build-fitsel-client]
    # Required metadata.
    homepage: https://github.com/kyzrfranz/fitsel-cli
    maintainer: "fitsel-client <https://github.com/kyzrfranz/fitsel-cli>"
    description: Sync Garmin activities to fitsel
    license: MIT
    # Install the binary to /usr/local/bin so apt/dnf put it on PATH and the
    # `fitsel-client --version` install check passes.
    contents:
      - src: ./dist/{{ .Binary }}/{{ .Binary }}
        dst: /usr/local/bin/{{ .Binary }}
        file_type: file
    formats:
      - deb
      - rpm

# Pinned so the release (and the cask's download URLs) always target the
# GitHub mirror, not whichever remote "origin" happens to be.
release:
  github:
    owner: kyzrfranz
    name: fitsel-cli

changelog:
  sort: asc

homebrew_casks:
  - name: fitsel-client
    repository:
      owner: kyzrfranz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/kyzrfranz/fitsel-cli
    description: Sync Garmin activities to fitsel
    # The binary is not signed/notarized: drop the quarantine flag so
    # Gatekeeper does not block it on first run.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/fitsel-client"]
          end

# Scoop manifest for the public Scoop bucket, so `scoop install kyzrfranz/tap/fitsel-client`
# resolves this release. Writes into the folder bucket of the existing kyzrfranz/homebrew-tap
# repo (same repository.owner/name as the cask above) with the same token, so no new repo or
# secret. Rides the existing windows builds via ids [build-fitsel-client]; the manifest's
# URL is filled from the archives it consumes.
scoops:
  - name: fitsel-client
    description: Sync Garmin activities to fitsel
    homepage: https://github.com/kyzrfranz/fitsel-cli
    license: MIT
    repository:
      owner: kyzrfranz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The zip archive built above is what Scoop installs; name_template must match it.
    archive_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.zip"
    ids:
      - build-fitsel-client

# Winget manifest, generated to dist/ only (skip_upload: true). Nothing is sent to Microsoft;
# the founder submits it by hand if wanted. Rides the existing windows builds via ids
# [build-fitsel-client].
wingets:
  - packageIdentifier: kyzrfe.fitselcli
    publisher: kyzrfe
    shortDescription: Sync Garmin activities to fitsel
    homepage: https://github.com/kyzrfranz/fitsel-cli
    license: MIT
    url_template: "https://github.com/kyzrfranz/fitsel-cli/releases/download/{{ .Tag }}/{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.zip"
    skip_upload: true
    ids:
      - build-fitsel-client
